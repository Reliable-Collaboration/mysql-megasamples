[project]
name = "sql-megasamples"
version = "2.0.0.dev0"
description = "Sample databases for MySQL, PostgreSQL and SQLite: images, files and a browsing console, built from upstream sources"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "PyMySQL[rsa]>=1.2.0",
    "duckdb>=1.1",
    "lxml>=5.0",
    "sqlglot>=25.0",
    "py7zr>=1.1.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
