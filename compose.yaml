# Every service carries a mem_limit. WSL2 gave this host 15.5 GB and ran out of it while the
# experiment was running, because nothing anywhere was bounded -- not the loads, not the consoles.
# A container with no limit can see the whole VM, so one process going wide takes the machine down
# rather than failing on its own. These figures are chosen so both repositories' console stacks can
# be up together in about 7.5 GB; a timed run needs its consoles down regardless, since a server
# reading the data competes with the thing being measured.
# The browsing console (PLAN.md section 12, task C-01).
#
#   docker compose up -d           the database, the four UIs and the landing page: one stack
#   docker compose down            all of it down again
#   docker compose up -d mysql     just the database, when that is all you want
#
# These six services are one Compose project and are meant to come up and go down together -- that
# is the whole point of them being in one file. Everything else this repository starts (the build
# server, the SQL Server used for the WideWorldImporters export, the loader, the test servers) is
# transient, is labelled `megasamples.transient=true`, and is listed and removed by
# `python3 scripts/workspace.py` (`make status`, `make clean`).
#
# Nothing here is baked into the published image: no UI ships inside mysql-megasamples, and
# `docker compose up -d mysql` is the same database it always was. Every port binds to 127.0.0.1
# rather than 0.0.0.0 -- an unauthenticated
# database UI should not appear on the network because someone opened a laptop in a cafe.
# Publishing them more widely is a deliberate edit, not a default.
#
# Two accounts reach the database, and every console offers both: `demo` has SELECT and SHOW VIEW
# only, `admin` has ALL PRIVILEGES. Each console opens on the read-only one, because the safe account
# should be the one you get without choosing -- phpMyAdmin and DbGate and CloudBeaver each list the
# two side by side, and Adminer's login form takes either.
#
# The passwords are boilerplate and committed on purpose: this is a disposable test database and
# `docker compose up` should need no setup. To change them, copy .env.example to .env and edit it --
# compose passes each value both to the server, which applies it with ALTER USER at startup, and to
# every console, so the two cannot drift apart.
#
# Images are pinned by digest rather than by tag. That is good practice anyway, and on this machine
# it is also load-bearing: the Docker daemon cannot fetch blobs from Docker Hub's CDN over its own
# network stack, so the images are fetched by `scripts/pull_image.py` over IPv4 and referred to here
# by the digest that produced (knowledge/runbooks/ipv6-and-privileges.md).
#
# CloudBeaver does start unattended, but only through a mechanism its wiki does not mention: a
# java.util.Properties file at conf/.cloudbeaver.auto.conf, whose mere presence makes the server
# configure itself instead of showing its first-launch wizard. Environment variables alone do not do
# it. The connection is seeded separately, and made visible to anonymous visitors by
# grantConnectionsAccessToAnonymousTeam -- a global connection is granted to nobody by default, so
# without it the wizard is gone but the sidebar is empty
# (knowledge/runbooks/cloudbeaver-unattended-startup.md).

name: mysql-megasamples

services:
  mysql:
    image: ${MEGASAMPLES_IMAGE:-mysql-megasamples:dev}
    mem_limit: 2g
    container_name: megasamples-mysql
    ports: ["127.0.0.1:3306:3306"]
    environment:
      # applied by docker/entrypoint-wrapper.sh at startup, since the baked data directory means the
      # official entrypoint's account setup never runs
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "mysql -udemo -p\"$$DEMO_PASSWORD\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  console:
    image: nginx@sha256:3bcf852aed06467cf075c6105892e4d5a6ebbbafa0ce22d35062db9e90ddef4c
    mem_limit: 32m
    container_name: megasamples-console
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./docker/console:/usr/share/nginx/html:ro
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin@sha256:20fa6f724ba77d41abc25b1aeb4d97692ce344c7ace305594e57c5893f60f0f7
    mem_limit: 256m
    container_name: megasamples-phpmyadmin
    ports: ["127.0.0.1:8081:80"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: "3306"
      # deliberately no PMA_USER: it would force the same account on every server. The two servers,
      # one per account, are defined in the mounted config.user.inc.php, which reads these.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      UPLOAD_LIMIT: 256M
    volumes:
      - ./docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped

  adminer:
    image: adminer@sha256:f1e2ba27b10a565ac77b2d8555d803be4ddb3232f4216dcf0ea85bcd8f2f1343
    mem_limit: 160m
    container_name: megasamples-adminer
    ports: ["127.0.0.1:8082:8080"]
    environment:
      # Adminer's login form remains even with the server preset -- measured, not assumed -- so the
      # landing page states the credentials rather than pretending the field is filled in.
      ADMINER_DEFAULT_SERVER: mysql
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped

  dbgate:
    image: dbgate/dbgate@sha256:14fce4ece52df514e0d320dc82cbfbca5e8f18f98464a6389b1c126f783a6b7e
    mem_limit: 320m
    container_name: megasamples-dbgate
    ports: ["127.0.0.1:8083:3000"]
    environment:
      CONNECTIONS: demo,admin
      LABEL_demo: megasamples (read-only)
      SERVER_demo: mysql
      PORT_demo: "3306"
      USER_demo: demo
      PASSWORD_demo: ${DEMO_PASSWORD:-demo}
      # confirmed from DbGate's own log, which the record could only infer from the mssql example
      ENGINE_demo: mysql@dbgate-plugin-mysql
      LABEL_admin: megasamples (full access)
      SERVER_admin: mysql
      PORT_admin: "3306"
      USER_admin: admin
      PASSWORD_admin: ${ADMIN_PASSWORD:-admin}
      ENGINE_admin: mysql@dbgate-plugin-mysql
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver@sha256:3b4bf82287cf4febe0d335873f1346a01100f3951d266cd6a78c27fe30429cbc
    mem_limit: 640m
    container_name: megasamples-cloudbeaver
    ports: ["127.0.0.1:8084:8978"]
    environment:
      # a global connection is granted to no subject by default, so an anonymous visitor sees an
      # empty sidebar without this; measured, not assumed
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: "true"
      # show the host, port and database rather than masking them from non-administrators
      CLOUDBEAVER_APP_READ_ONLY_CONNECTION_INFO: "true"
      # let ${...} in initial-data-sources.conf read these; without it the literal text is sent as
      # the password and the connection fails. Measured both ways.
      CLOUDBEAVER_SYSTEM_VARIABLES_RESOLVING_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    volumes:
      # the dotfile is the trigger for unattended startup; the .conf is copied into the workspace by
      # the image's own entrypoint, which does it only while workspace/.metadata does not exist
      - ./docker/cloudbeaver/.cloudbeaver.auto.conf:/opt/cloudbeaver/conf/.cloudbeaver.auto.conf:ro
      - ./docker/cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    depends_on: { mysql: { condition: service_healthy } }
    restart: unless-stopped
