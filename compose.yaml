# Generated by `python3 -m megasamples compose` from megasamples.yaml. Do not edit: the next
# `make up` rewrites it. ARCHITECTURE.md section 6 explains every rule the file follows.
name: sql-megasamples
services:
  mysql:
    image: ${MEGASAMPLES_MYSQL_IMAGE:-sql-megasamples-mysql:dev}
    mem_limit: 1g
    command:
    - mysqld
    - --innodb-buffer-pool-size=256M
    container_name: megasamples-mysql
    ports:
    - 127.0.0.1:3306:3306
    environment:
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
    healthcheck:
      test:
      - CMD-SHELL
      - mysql -udemo -p"$$DEMO_PASSWORD" -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  landing:
    image: nginx@sha256:3bcf852aed06467cf075c6105892e4d5a6ebbbafa0ce22d35062db9e90ddef4c
    mem_limit: 32m
    container_name: megasamples-landing
    ports:
    - 127.0.0.1:8080:80
    restart: unless-stopped
    volumes:
    - ./consoles/landing:/usr/share/nginx/html:ro
    depends_on:
      mysql:
        condition: service_healthy
  phpmyadmin:
    image: phpmyadmin@sha256:20fa6f724ba77d41abc25b1aeb4d97692ce344c7ace305594e57c5893f60f0f7
    mem_limit: 256m
    container_name: megasamples-phpmyadmin
    ports:
    - 127.0.0.1:8081:80
    restart: unless-stopped
    volumes:
    - ./consoles/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: '3306'
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      UPLOAD_LIMIT: 256M
  adminer:
    image: adminer@sha256:f1e2ba27b10a565ac77b2d8555d803be4ddb3232f4216dcf0ea85bcd8f2f1343
    mem_limit: 160m
    container_name: megasamples-adminer
    ports:
    - 127.0.0.1:8082:8080
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: mysql
  dbgate:
    image: dbgate/dbgate@sha256:14fce4ece52df514e0d320dc82cbfbca5e8f18f98464a6389b1c126f783a6b7e
    mem_limit: 320m
    container_name: megasamples-dbgate
    ports:
    - 127.0.0.1:8083:3000
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CONNECTIONS: mysql_demo,mysql_admin
      LABEL_mysql_demo: MySQL (read-only)
      SERVER_mysql_demo: mysql
      PORT_mysql_demo: '3306'
      USER_mysql_demo: demo
      PASSWORD_mysql_demo: ${DEMO_PASSWORD:-demo}
      ENGINE_mysql_demo: mysql@dbgate-plugin-mysql
      LABEL_mysql_admin: MySQL (full access)
      SERVER_mysql_admin: mysql
      PORT_mysql_admin: '3306'
      USER_mysql_admin: admin
      PASSWORD_mysql_admin: ${ADMIN_PASSWORD:-admin}
      ENGINE_mysql_admin: mysql@dbgate-plugin-mysql
  cloudbeaver:
    image: dbeaver/cloudbeaver@sha256:3b4bf82287cf4febe0d335873f1346a01100f3951d266cd6a78c27fe30429cbc
    mem_limit: 640m
    container_name: megasamples-cloudbeaver
    ports:
    - 127.0.0.1:8084:8978
    restart: unless-stopped
    volumes:
    - ./consoles/cloudbeaver/.cloudbeaver.auto.conf:/opt/cloudbeaver/conf/.cloudbeaver.auto.conf:ro
    - ./consoles/cloudbeaver/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      CLOUDBEAVER_APP_GRANT_CONNECTIONS_ACCESS_TO_ANONYMOUS_TEAM: 'true'
      CLOUDBEAVER_APP_READ_ONLY_CONNECTION_INFO: 'true'
      CLOUDBEAVER_SYSTEM_VARIABLES_RESOLVING_ENABLED: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
