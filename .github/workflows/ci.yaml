# Builds the CI subset of datasets from their pinned upstream artifacts, verifies each one against
# its committed baselines, then bakes and tests an image. PLAN.md sections 4.3 and 11 (task R-01).
name: ci

on:
  push:
    paths-ignore: ["knowledge/**", "**.md"]
  pull_request:
    paths-ignore: ["knowledge/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the project environment
        run: uv sync --frozen

      # The build server is started by scripts/db.py as a container, not as a service container:
      # it needs a specific my.cnf and bind mounts, and the same code path then runs locally and here.
      - name: Pull the pinned server image
        run: docker pull mysql:9.7.2

      - name: Cache upstream downloads
        uses: actions/cache@v4
        with:
          path: downloads
          key: downloads-${{ hashFiles('manifest.yaml') }}
          restore-keys: downloads-

      - name: Free disk space
        # a hosted runner has ~14 GB free and the image plus downloads need most of it
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build and verify the CI subset
        run: make core-fast

      - name: Bake the image from that subset
        # image-only, not image: `make core-fast` has already loaded every dataset into the build
        # server, and `image` would re-run the whole pipeline as its prerequisites
        run: make image-only DATASETS="$(make -s print-core-fast)"

      - name: Test the image
        run: make test-image DATASETS="$(make -s print-core-fast)"

      - name: Show what was built
        if: always()
        run: |
          docker images mysql-megasamples:dev --format '{{.Size}}' || true
          df -h /
