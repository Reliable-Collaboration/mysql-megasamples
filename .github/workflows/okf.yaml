# Validates the knowledge bundle. Cheap and dependency-light, so it runs on everything.
name: knowledge bundle

on:
  push:
  pull_request:

jobs:
  okf-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check PyYAML
      - name: Validate the OKF bundle
        run: python3 scripts/okf_check.py
      - name: Generated licence files are not stale
        # --no-measurements: build/ is git-ignored and this job builds nothing, so only the
        # knowledge-derived part of the generated files can be compared here (PLAN.md 8.3).
        run: python3 scripts/gen_provenance.py --check --no-measurements
