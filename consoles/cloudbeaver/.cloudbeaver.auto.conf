# CloudBeaver's unattended configuration, read at first start by CBApplication.performAutoConfiguration.
#
# The file has to be a java.util.Properties file at exactly conf/.cloudbeaver.auto.conf inside the
# server directory; /opt/cloudbeaver/.cloudbeaver.auto.conf and workspace/.cloudbeaver.auto.conf are
# both ignored (all three were tried). Its presence is what triggers auto configuration: without it
# the log says "No auto configuration was found. Server must be configured manually" and the server
# stays in configurationMode, showing its first-launch wizard. The four keys below are the ones
# CBApplication reads; each can also be supplied as an environment variable of the same name, but the
# file must exist either way.
#
# The administrator is created because finishConfiguration() takes a name and a password, not because
# the console needs one: visitors browse anonymously. The password satisfies the server's own policy
# (8 characters, mixed case, one digit) and is stated in consoles/landing/index.html, since anyone who
# can reach this console on loopback can already read this file.
CB_SERVER_NAME=MySQL Megasamples
CB_SERVER_URL=http://127.0.0.1:8084
CB_ADMIN_NAME=cbadmin
CB_ADMIN_PASSWORD=Megasamples1
