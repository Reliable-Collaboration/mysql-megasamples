# What each engine's port does not carry, one line per object, with the reason.
# Generated by the port; the catalogue and the landing page read it.
postgres: []
sqlite:
- 'salesorderdetail.salesorderdetailid: AUTO_INCREMENT on a column that is not the whole primary key: SQLite auto-assigns
  only a single-column INTEGER PRIMARY KEY; inserts must supply it'
- 'function ufngetsalesorderstatustext: SQLite has no stored routines'
- 'view vproductmodelcatalogdescription: EXTRACTVALUE: SQLite has no XML functions'
