    type: BTREE
    unique: false
  pl_target_id:
    columns:
    - pl_target_id
    - pl_from
    type: BTREE
    unique: false
redirect:
  PRIMARY:
    columns:
    - rd_from
    type: BTREE
    unique: true
  rd_ns_title:
