# S6: every index that must exist after load.
category:
  PRIMARY:
    columns:
    - cat_id
    type: BTREE
    unique: true
  cat_pages:
    columns:
    - cat_pages
    type: BTREE
    unique: false
  cat_title:
    columns:
    - cat_title
    type: BTREE
    unique: true
categorylinks:
