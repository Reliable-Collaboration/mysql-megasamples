# the indexes the plan asks for on 259k rows
- name: crimes_in_a_date_window
  query: "SELECT COUNT(*) FROM crimes WHERE date >= '2024-07-01' AND date < '2024-07-02'"
  must_not_full_scan: [crimes]
- name: crimes_by_type
  query: SELECT COUNT(*) FROM crimes WHERE primary_type = 'HOMICIDE'
  must_not_full_scan: [crimes]
- name: crimes_by_beat
  query: SELECT COUNT(*) FROM crimes WHERE beat = 111
  must_not_full_scan: [crimes]
