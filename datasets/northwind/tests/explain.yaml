# order_details and orders are the only tables big enough for a plan assertion to mean anything.
- name: order_details_by_order
  query: SELECT COUNT(*) FROM order_details WHERE orderid = 10248
  must_not_full_scan: [order_details]
- name: orders_by_customer
  query: SELECT COUNT(*) FROM orders WHERE customerid = 'VINET'
  must_not_full_scan: [orders]
