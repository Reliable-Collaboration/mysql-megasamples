# What each engine's port does not carry, one line per object, with the reason.
# Generated by the port; the catalogue and the landing page read it.
postgres:
- 'address.idx_location: SPATIAL index: not ported'
sqlite:
- 'address.idx_location: SPATIAL index: not ported'
- 'procedure film_in_stock: SQLite has no stored routines'
- 'procedure film_not_in_stock: SQLite has no stored routines'
- 'function get_customer_balance: SQLite has no stored routines'
- 'function inventory_held_by_customer: SQLite has no stored routines'
- 'function inventory_in_stock: SQLite has no stored routines'
- 'procedure rewards_report: SQLite has no stored routines'
- 'view actor_info: SQLite group_concat cannot combine DISTINCT with a separator or an ORDER BY'
