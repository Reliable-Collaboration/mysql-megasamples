# The two large tables; a plan assertion is only meaningful where a scan would actually hurt.
- name: salaries_by_employee
  query: SELECT COUNT(*) FROM salaries WHERE emp_no = 10001
  must_not_full_scan: [salaries]
- name: dept_emp_by_employee
  query: SELECT COUNT(*) FROM dept_emp WHERE emp_no = 10001
  must_not_full_scan: [dept_emp]
