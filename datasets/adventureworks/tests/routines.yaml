# S8: calls of the stored routines, with arguments as MySQL literals. What each call prints on
# MySQL is pinned into routines.expected.yaml (normalised and sorted line by line,
# megasamples/probe.py), and every port must print the same. A call runs inside a transaction
# that is rolled back; `probe` is a query printed after the call; `error: true` means the call
# must fail, on every engine; `probe_only: true` compares the probe alone, not the OUT values.
# The three update procedures are called with a businessentityid that does not exist, so nothing
# changes; uspupdateemployeehireinfo then inserts a pay-history row for it, which its foreign key
# rejects, and its handler calls usplogerror(), which the T-SQL conversion does not carry: the call
# fails, on MySQL as on every port (knowledge/datasets/adventureworks.md).
- {name: ufngetaccountingenddate, routine: ufngetaccountingenddate, args: []}
- {name: ufngetaccountingstartdate, routine: ufngetaccountingstartdate, args: []}
- {name: ufngetdocumentstatustext_1, routine: ufngetdocumentstatustext, args: [1]}
- {name: ufngetdocumentstatustext_9, routine: ufngetdocumentstatustext, args: [9]}
- {name: ufngetproductdealerprice_707, routine: ufngetproductdealerprice, args: [707, "'2023-08-01'"]}
- {name: ufngetproductlistprice_707, routine: ufngetproductlistprice, args: [707, "'2023-08-01'"]}
- {name: ufngetproductlistprice_707_now, routine: ufngetproductlistprice, args: [707, "'2025-01-01'"]}
- {name: ufngetproductstandardcost_707, routine: ufngetproductstandardcost, args: [707, "'2023-08-01'"]}
- {name: ufngetpurchaseorderstatustext_2, routine: ufngetpurchaseorderstatustext, args: [2]}
- {name: ufngetsalesorderstatustext_5, routine: ufngetsalesorderstatustext, args: [5]}
