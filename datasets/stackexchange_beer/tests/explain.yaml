- name: answers_of_a_question
  query: SELECT COUNT(*) FROM posts WHERE parentid = 5
  must_not_full_scan: [posts]
- name: comments_on_a_post
  query: SELECT COUNT(*) FROM comments WHERE postid = 5
  must_not_full_scan: [comments]
- name: badges_of_a_user
  query: SELECT COUNT(*) FROM badges WHERE userid = 20
  must_not_full_scan: [badges]
