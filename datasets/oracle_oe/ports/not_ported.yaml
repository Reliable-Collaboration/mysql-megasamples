# What each engine's port does not carry, one line per object, with the reason.
# Generated by the port; the catalogue and the landing page read it.
postgres:
- 'customers.customers_account_manager_fk: foreign key into oracle_hr.employees (another database) not ported'
- 'warehouses.warehouses_location_fk: foreign key into oracle_hr.locations (another database) not ported'
- 'orders.orders_sales_rep_fk: foreign key into oracle_hr.employees (another database) not ported'
- 'view account_managers: references database oracle_hr'
- 'view customers_view: references database oracle_hr'
sqlite:
- 'customers.customers_account_manager_fk: foreign key into oracle_hr.employees (another database) not ported'
- 'warehouses.warehouses_location_fk: foreign key into oracle_hr.locations (another database) not ported'
- 'orders.orders_sales_rep_fk: foreign key into oracle_hr.employees (another database) not ported'
- 'view account_managers: references database oracle_hr'
- 'view customers_view: references database oracle_hr'
- 'trigger insert_ord_line: assigns primary-key column line_item_id before insert; a SQLite trigger cannot modify NEW and
  the row must carry its key first'
